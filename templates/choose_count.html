<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Nombre de patients</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(120deg,#d7e9ff,#b5f0ff);
        margin:0;
        padding:0;
    }
    .container {
        width: 450px;
        margin: 80px auto;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0px 5px 25px rgba(0,0,0,0.15);
    }
    h2 {text-align:center;margin-bottom:25px;color:#444;}
    input {width:100%;padding:12px;border-radius:8px;border:1px solid #aaa;margin-bottom:15px;}
    button{
        width:100%;padding:12px;border:none;border-radius:8px;
        background:#1f8bfd;color:white;font-size:16px;cursor:pointer;
    }
    button:hover{background:#0f6cdc;}
</style>
</head>

<body>
<div class="container">
    <h2>Combien de patients voulez-vous prédire ?</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="number" name="num" min="1" max="50" required>
        <button type="submit">Valider</button>
    </form>
</div>
</body>
</html>
