<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Formulaire Patients</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg,#d7e9ff,#b5f0ff);
    margin:0;padding:0;
}
.container{
    width:750px;margin:40px auto;background:white;padding:30px;
    border-radius:15px;box-shadow:0px 5px 25px rgba(0,0,0,0.15);
}
h2{text-align:center;margin-bottom:25px;color:#444;}
fieldset{
    border:1px solid #ddd;border-radius:8px;margin:10px 0;padding:15px;
}
input,select{
    width:100%;padding:10px;margin-bottom:8px;
    border-radius:8px;border:1px solid #ccc;
}
button{
    width:100%;padding:12px;background:#1f8bfd;color:white;
    cursor:pointer;border:none;border-radius:8px;font-size:16px;
}
button:hover{background:#0f6cdc;}
</style>
</head>

<body>
<div class="container">

    <h2>Formulaire pour {{ n }} patient(s)</h2>

    <form method="POST" action="{% url 'multi_form' n %}">
        {% csrf_token %}
        
        {% for f in forms %}
            <h3 style="text-align:center;color:#333;">Patient {{ forloop.counter }}</h3>
            <fieldset>
                {{ f.as_p }}
            </fieldset>
        {% endfor %}

        <button type="submit">Prédire</button>
    </form>
</div>
</body>
</html>
